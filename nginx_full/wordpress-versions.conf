#ddev-generated
# Remove the line above to take this file over, DDEV then won't overwrite it.
#
# One WordPress instance per version: <label>.<project> -> .Build/<label>, e.g.
# 71.<project>.ddev.site -> .Build/71/public. The rewrites do what WordPress' .htaccess
# does on Apache, including subdirectory multisite.

server {
    listen 80;
    listen 443 ssl;
    server_name ~^(?<wp_label>[0-9]+)\..*$;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    root /var/www/html/.Build/$wp_label/public;
    index index.php;
    client_max_body_size 100m;
    include /etc/nginx/monitoring.conf;
    sendfile off;
    error_log /dev/stdout info;
    access_log /var/log/nginx/access.log;

    # Core lives in public/wp-source, content in public/wp-content. Maps [/<site>]/wp-admin,
    # /wp-includes, /wp-content and /*.php there, for the main site and subdirectory multisite.
    if (!-e $request_filename) {
        rewrite /wp-admin$ $scheme://$host$uri/ permanent;
        rewrite ^(?:/[_0-9a-zA-Z-]+)?/(wp-admin|wp-includes)(/.*)?$ /wp-source/$1$2 last;
        rewrite ^(?:/[_0-9a-zA-Z-]+)?/wp-content(/.*)$ /wp-content$1 last;
        rewrite ^(?:/[_0-9a-zA-Z-]+)?/([^/]+\.php)$ /wp-source/$1 last;
    }

    location / {
        absolute_redirect off;
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_intercept_errors off;
        fastcgi_read_timeout 10m;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS $fcgi_https;
    }
}
