#ddev-generated
# Remove the line above to take this file over, DDEV then won't overwrite it.
#
# One WordPress instance per version: <label>.<project> -> .Build/<label>, e.g.
# 71.<project>.ddev.site -> .Build/71. The rules live in wordpress-versions.rules
# (DDEV copies it along, Apache only loads *.conf), so both vhosts share them.

<VirtualHost *:80>
    ServerName wordpress-versions.${DDEV_SITENAME}.${DDEV_TLD}
    ServerAlias *.${DDEV_SITENAME}.${DDEV_TLD}
    Include /etc/apache2/sites-enabled/wordpress-versions.rules
</VirtualHost>

<VirtualHost *:443>
    ServerName wordpress-versions.${DDEV_SITENAME}.${DDEV_TLD}
    ServerAlias *.${DDEV_SITENAME}.${DDEV_TLD}
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/master.crt
    SSLCertificateKeyFile /etc/ssl/certs/master.key
    Include /etc/apache2/sites-enabled/wordpress-versions.rules
</VirtualHost>
