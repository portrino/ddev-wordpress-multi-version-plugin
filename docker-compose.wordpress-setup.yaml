#ddev-generated
# Defaults of the wordpress-multi-version-plugin add-on. Override them in the
# project-owned .ddev/docker-compose.zz-project.yaml (sorts after this file, so
# its values win), it survives `ddev add-on get` updates.
services:
  web:
    volumes:
      # The plugin a second time, outside /var/www/html: WordPress maps a symlinked plugin
      # to its real directory, and /var/www/html would contain every other plugin's path too
      - ../:/var/www/plugin
    environment:
      # One instance per version, <major>.<minor>. After a change run
      # `ddev add-on get` again (hostnames and commands) and `ddev restart`.
      - WP_VERSIONS=6.4 7.1
      # Root entries of the plugin that are not linked into the instances; the
      # instance installs the plugin's dependencies itself
      - SYMLINK_EXCLUSIONS=vendor node_modules

      # WP config
      - WP_DB_USERNAME=root
      - WP_DB_PASSWORD=root
      - WP_DB_HOST=db
      - WP_SETUP_ADMIN_EMAIL=admin@example.com
      - WP_SETUP_ADMIN_USERNAME=admin
      - WP_SETUP_ADMIN_PASSWORD=Password1!
