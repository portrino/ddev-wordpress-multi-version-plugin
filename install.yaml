name: wordpress-multi-version-plugin

pre_install_actions:
  - |
    #ddev-description:Check for a supported webserver type
    if [ "${DDEV_WEBSERVER_TYPE}" != "apache-fpm" ] && [ "${DDEV_WEBSERVER_TYPE}" != "nginx-fpm" ]; then
      echo "This add-on only works with the apache-fpm or nginx-fpm webserver type."
      exit 1
    fi

  - |
    #ddev-description:Check for a valid composer.json
    # Fails here, before any files are copied, instead of much later inside
    # `composer require` on the first `ddev install`.
    if [ ! -f "${DDEV_APPROOT}/composer.json" ]; then
      echo "No composer.json found in the project root. This add-on requires a WordPress plugin with a valid composer.json - see the README prerequisites.";
      exit 1;
    fi
    if ! command -v jq >/dev/null 2>&1; then
      echo "jq is required to read composer.json but was not found. Install jq and try again.";
      exit 1;
    fi
    if [ -z "$(jq -r '.name // empty' "${DDEV_APPROOT}/composer.json")" ]; then
      echo "composer.json has no \"name\" field. Set one (e.g. \"vendor/my-plugin\") and try again.";
      exit 1;
    fi
    # Without this type composer/installers puts the plugin into vendor/ instead of wp-content/plugins/
    if [ "$(jq -r '.type // empty' "${DDEV_APPROOT}/composer.json")" != "wordpress-plugin" ]; then
      echo "composer.json needs \"type\": \"wordpress-plugin\".";
      exit 1;
    fi

project_files:
  - docker-compose.wordpress-setup.yaml
  - .setup/scripts/run
  - .setup/scripts/utils.sh
  - .setup/scripts/write-git-info.sh
  - .setup/docker-compose.zz-project.yaml.example
  - apache/wordpress-versions.conf
  - apache/wordpress-versions.rules
  - nginx_full/wordpress-versions.conf
  - commands/web/install
  - commands/web/all

ddev_version_constraint: '>= v1.24.10'

post_install_actions:
  - |
    #ddev-description:Generate hostnames and version commands from WP_VERSIONS
    # DDEV needs the hostnames and the commands before it starts, so they're generated
    # here from WP_VERSIONS. The project-owned docker-compose.zz-project.yaml wins over
    # the add-on's default. Changing WP_VERSIONS means running `ddev add-on get` again.
    wp_versions=""
    override="${DDEV_APPROOT}/.ddev/docker-compose.zz-project.yaml"
    if [ -f "$override" ]; then
      wp_versions=$(grep -oE 'WP_VERSIONS=[0-9. ]+' "$override" | head -n1 | cut -d= -f2)
    fi
    if [ -z "$wp_versions" ]; then
      wp_versions=$(grep -oE 'WP_VERSIONS=[0-9. ]+' "${DDEV_APPROOT}/.ddev/docker-compose.wordpress-setup.yaml" | head -n1 | cut -d= -f2)
    fi
    for version in $wp_versions; do
      if ! [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
        echo "Invalid WordPress version '$version' in WP_VERSIONS, use <major>.<minor>, e.g. 7.1."
        exit 1
      fi
    done

    # Commands generated for a previous WP_VERSIONS
    for file in "${DDEV_APPROOT}"/.ddev/commands/web/*; do
      if grep -q '^## Generated by the wordpress-multi-version-plugin add-on' "$file" 2>/dev/null; then
        rm -f "$file"
      fi
    done

    {
      echo "#ddev-generated"
      echo "# Generated by the wordpress-multi-version-plugin add-on from WP_VERSIONS, don't edit."
      # Project type wordpress for DDEV's WP-CLI; the instances get their own wp-config.php
      echo "type: wordpress"
      echo "disable_settings_management: true"
      echo "docroot: .Build"
      echo "additional_hostnames:"
      for version in $wp_versions; do
        echo "  - ${version//./}.${DDEV_PROJECT}"
      done
      echo "hooks:"
      echo "  pre-start:"
      echo "    - exec-host: mkdir -p .Build"
    } > "${DDEV_APPROOT}/.ddev/config.wordpress-setup.yaml"

    for version in $wp_versions; do
      label="${version//./}"
      {
        echo "#!/usr/bin/env bash"
        echo ""
        echo "## Generated by the wordpress-multi-version-plugin add-on from WP_VERSIONS, don't edit."
        echo "## Description: Run a command in the WordPress ${version} instance (.Build/${label})."
        echo "## Usage: ${label} <command>"
        echo "## Example: \"ddev ${label} wp plugin list\""
        echo ""
        echo "exec bash .ddev/.setup/scripts/run ${version} \"\$@\""
      } > "${DDEV_APPROOT}/.ddev/commands/web/${label}"
      chmod +x "${DDEV_APPROOT}/.ddev/commands/web/${label}"
    done
    echo "WordPress wp_versions: ${wp_versions} (hostnames and 'ddev <version>' commands)"

  - |
    #ddev-description:Add .Build/ to .gitignore
    gitignore="${DDEV_APPROOT}/.gitignore"
    if ! grep -qxF ".Build/" "$gitignore" 2>/dev/null; then
      echo ".Build/" >> "$gitignore"
      echo "Added '.Build/' to .gitignore."
    fi

  - |
    #ddev-description:Outro
    echo "Run 'ddev restart' and then 'ddev install all' to install the WordPress instances."

removal_actions:
  - rm -f "${DDEV_APPROOT}/.ddev/config.wordpress-setup.yaml"
  - |
    for file in "${DDEV_APPROOT}"/.ddev/commands/web/*; do
      if grep -q '^## Generated by the wordpress-multi-version-plugin add-on' "$file" 2>/dev/null; then
        rm -f "$file"
      fi
    done
